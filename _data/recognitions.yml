# Recognitions
- award: Best Student Award
  organization: Lions International, Multiple District 317 & Negilayogi Samaja Seva Trust (R)
  year: Dec 2024
  summary: Recognized as the Best Student for exceptional academic excellence and all-round achievements in engineering. The award was presented at a prestigious ceremony held at Senate Bhavan, Mysuru, in the presence of eminent personalities including Dr. C.N. Ashwathnarayan, Shri Yaduveer Krishnadatta Chamaraja Wadiyar, and Shri Adaguru H. Vishwanath.
